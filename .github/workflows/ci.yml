name: Quality

# Runs on every pull request, and is called by the deploy workflow so the same
# checks gate anything that reaches production.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Type check, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # `npm run build` already runs `astro check`, which type checks the
      # components and validates every content collection against its schema.
      - name: Type check and build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run accessibility and layout tests
        run: npm test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
