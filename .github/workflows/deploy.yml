name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  # The Writing section is built from the Compute Blog RSS feed, so the site
  # has to rebuild on its own for a new post to appear. 05:20 UTC is ~10:50 IST.
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Pushes are gated on the full quality suite. Scheduled rebuilds skip it:
  # those runs exist only to pull in a new blog post from the feed, and the
  # content of master has already passed these checks.
  quality:
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/ci.yml

  build:
    needs: quality
    if: always() && needs.quality.result != 'failure' && needs.quality.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
